server:
  port: 8080

spring:
  application:
    name: mural-fyi
  datasource:
    url: jdbc:h2:~/test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  upload:
    dir: uploads
  jwt:
    secret: ${JWT_SECRET:chave-secreta-ninja-com-no-minimo-32-caracteres-123456}
    expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always